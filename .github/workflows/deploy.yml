name: Build and deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SEOHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

      - name: Download covers from server
        run: |
          mkdir -p public/images/covers
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p 57185" \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }}:/home/${{ secrets.SEOHOST_USER }}/domains/lexpraktyk.pl/public_html/images/covers/ \
            public/images/covers/
          test -f public/images/covers/manifest.json

      - name: Build
        run: npm run build
        env:
          GENERATE_COVERS: '1'
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Deploy static files
        # Served by the Node adapter (Passenger), not LiteSpeed: pages must NOT
        # exist as directories in public_html, or LiteSpeed 301s them to the
        # slash form before .htaccess is consulted. public_html keeps only
        # .htaccess and images/covers (the cover store, served fast via -f).
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 57185" \
            dist/client/ \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }}:/home/${{ secrets.SEOHOST_USER }}/domains/lexpraktyk.pl/client/

      - name: Deploy server
        run: |
          cp server-start.mjs dist/server/start.mjs
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 57185" \
            dist/server/ \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }}:/home/${{ secrets.SEOHOST_USER }}/domains/lexpraktyk.pl/server/
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p 57185" \
            package.json package-lock.json \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }}:/home/${{ secrets.SEOHOST_USER }}/domains/lexpraktyk.pl/

      - name: Install server dependencies
        run: |
          ssh -i ~/.ssh/deploy_key -p 57185 \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }} \
            "source ~/nodevenv/domains/ogrzeje.pl/22/bin/activate && cd ~/domains/lexpraktyk.pl && npm install --omit=dev"

      - name: Restart Node.js
        run: |
          ssh -i ~/.ssh/deploy_key -p 57185 \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }} \
            "touch ~/domains/lexpraktyk.pl/tmp/restart.txt"

      - name: Upload cover images
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p 57185" \
            public/images/covers/ \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }}:/home/${{ secrets.SEOHOST_USER }}/domains/lexpraktyk.pl/public_html/images/covers/

      - name: Sync covers store to the SSR runtime dir
        # SSR pages resolve covers from domains/lexpraktyk.pl/public/images/covers
        # at request time; keep it identical to the store so category thumbnails
        # always match the article covers.
        run: |
          ssh -i ~/.ssh/deploy_key -p 57185 \
            ${{ secrets.SEOHOST_USER }}@${{ secrets.SEOHOST_HOST }} \
            "rsync -a ~/domains/lexpraktyk.pl/public_html/images/covers/ ~/domains/lexpraktyk.pl/public/images/covers/"
